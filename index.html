<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d15" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SUN Fuel" />
  <meta name="description" content="Control semiautomático de consumo y abastecimiento de combustible de SUNCHODESA." />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>SUN Fuel · SUNCHODESA</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">ϟ</span><span><strong>SUN<span class="brand-accent">FUEL</span></strong><small>SUNCHODESA · CONTROL DE GENERACIÓN</small></span></div>
      <span class="top-status" id="status-pill"><i></i> LOCAL</span>
    </header>
    <main class="content" id="content" aria-live="polite"></main>
    <nav class="nav" aria-label="Secciones de la aplicación" id="nav">
      <button data-page="inicio" class="nav-btn active" aria-label="Inicio"><span class="nav-icon">⌂</span><span>Inicio</span></button>
      <button data-page="simulador" class="nav-btn" aria-label="Simulador"><span class="nav-icon">▥</span><span>Simular</span></button>
      <button data-page="cnel" class="nav-btn" aria-label="Compensación CNEL"><span class="nav-icon">↗</span><span>CNEL</span></button>
      <button data-page="reservas" class="nav-btn" aria-label="Reservas"><span class="nav-icon">◫</span><span>Reservas</span></button>
      <button data-page="tanqueadas" class="nav-btn" aria-label="Tanqueadas"><span class="nav-icon">⇄</span><span>Tanqueadas</span></button>
      <button data-page="ajustes" class="nav-btn" aria-label="Ajustes"><span class="nav-icon">⚙</span><span>Ajustes</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
